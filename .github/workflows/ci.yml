name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: attendance
          POSTGRES_DB: attendance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Format tekshiruvi
        working-directory: server
        run: npm run format:check

      - name: Testlar
        working-directory: server
        env:
          DATABASE_URL: postgres://attendance:attendance@localhost:5432/attendance_test
        run: npm test

  e2e:
    name: E2E testlar (Playwright)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        working-directory: server
        run: npm ci

      - name: Playwright brauzerini o'rnatish
        working-directory: server
        run: npx playwright install --with-deps chromium

      - name: Serverni ishga tushirish
        working-directory: server
        run: |
          node scripts/dev-local.js &
          npx wait-on http://127.0.0.1:3000/api/health -t 60000

      - name: E2E testlar
        working-directory: server
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

  build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Docker build (server)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          tags: klinika-attendance-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build (web)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          tags: klinika-attendance-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
